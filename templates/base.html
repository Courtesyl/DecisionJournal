<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Decisions{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/vendor/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
<main class="container">
  <nav>
    <ul>
      <li><a href="/" class="brand"><span class="mark mark-sq"></span><span class="mark mark-ci"></span><span class="mark mark-tri"></span>Decisions</a></li>
    </ul>
    <ul>
      <li><a href="/">Главная</a></li>
      <li><a href="/new">+ Новое</a></li>
      <li><a href="/calibration">Калибровка</a></li>
      <li><a href="/export.json">Экспорт</a></li>
      <li>
        <form method="post" action="/logout" class="inline-form">
          <button type="submit" class="linklike">Выход</button>
        </form>
      </li>
      {% if can_exit %}
      <li>
        <form method="post" action="/exit" class="inline-form">
          <button type="submit" class="linklike">Завершить</button>
        </form>
      </li>
      {% endif %}
    </ul>
  </nav>
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
